name: Matrix-NLU Training

on:
  push:
    branches: [main]
    paths:
      - 'matrix_nlu/labels.py'
      - 'matrix_nlu/model.py'
      - 'matrix_nlu/training_data.py'
      - 'matrix_nlu/prepare_massive.py'
      - 'matrix_nlu/train.py'
      - 'matrix_nlu/train_config.json'
      - 'matrix_nlu/requirements-train.txt'
      - 'matrix_nlu/test_training_data.py'
      - 'matrix_nlu/test_prepare_massive.py'
      - '.github/workflows/matrix-nlu-train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: matrix_nlu/requirements-train.txt
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: matrix-nlu-geotrend-36de33ec-v1
      - name: Install pinned training dependencies
        run: python -m pip install --requirement matrix_nlu/requirements-train.txt
      - name: Software and dataset tests
        run: python -m unittest discover -s matrix_nlu -p 'test_*.py' -v
      - name: Build Matrix and P0.5 typed datasets
        run: python matrix_nlu/build_dataset.py
      - name: Prepare hash-verified MASSIVE auxiliary data
        run: >-
          python matrix_nlu/prepare_massive.py
          --train-per-language 3000
          --dev-per-language 600
          --test-per-language 1000
          --seed 810923
      - name: Record pre-training resources
        run: |
          df -h .
          free -h
          python - <<'PY'
          import torch
          print('torch', torch.__version__)
          print('threads', torch.get_num_threads())
          PY
      - name: Train six-layer teacher and evaluate frozen sets once
        run: >-
          python matrix_nlu/train.py
          --config matrix_nlu/train_config.json
          --data-dir build/matrix-nlu/data
          --massive-dir build/matrix-nlu/massive
          --output-dir build/matrix-nlu/training
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-nlu-teacher-evidence
          path: |
            build/matrix-nlu/training/
            !build/matrix-nlu/training/checkpoints/
            build/matrix-nlu/data/*manifest.json
            build/matrix-nlu/massive/manifest.json
            build/matrix-nlu/massive/MASSIVE-LICENSE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-nlu-teacher-resume-checkpoint
          compression-level: 1
          path: build/matrix-nlu/training/checkpoints/
