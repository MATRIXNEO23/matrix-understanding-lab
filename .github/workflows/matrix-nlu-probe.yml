name: Matrix-NLU Candidate Probe

on:
  push:
    branches: [main]
    paths:
      - 'matrix_nlu/**'
      - 'docs/MATRIX_NLU_MODEL_DATA_PLAN.md'
      - '.github/workflows/matrix-nlu-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: matrix_nlu/requirements-probe.txt
      - name: Install pinned probe dependencies
        run: python -m pip install --requirement matrix_nlu/requirements-probe.txt
      - name: Unit tests
        run: python -m unittest discover -s matrix_nlu -p 'test_*.py' -v
      - name: Build deterministic Matrix dataset
        run: python matrix_nlu/build_dataset.py
      - name: Resolve candidates and tokenizer coverage
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python matrix_nlu/probe_candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-nlu-candidate-probe
          path: build/matrix-nlu/
