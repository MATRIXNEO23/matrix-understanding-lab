name: Matrix-NLU Post-Training Gates

on:
  workflow_run:
    workflows: ['Matrix-NLU Training']
    types: [completed]
  workflow_dispatch:
    inputs:
      training_run_id:
        description: Successful Matrix-NLU Training run id
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  dev-calibration-frozen-export:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: matrix_nlu/requirements-train.txt
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: matrix-nlu-geotrend-36de33ec-v1
      - name: Resolve and download immutable training evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SOURCE_RUN="${{ github.event.workflow_run.id }}"
          else
            SOURCE_RUN="${{ inputs.training_run_id }}"
          fi
          echo "SOURCE_TRAINING_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
          gh run download "$SOURCE_RUN" --name matrix-nlu-teacher-evidence --dir downloaded
          RESULT=$(find downloaded -type f -name training-result.json -print -quit)
          test -n "$RESULT"
          BUNDLE=$(dirname "$RESULT")
          echo "TRAINING_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          sha256sum "$BUNDLE"/training-result.json "$BUNDLE"/model-state.pt "$BUNDLE"/labels.json
      - name: Install pinned evaluation and export dependencies
        run: python -m pip install --requirement matrix_nlu/requirements-train.txt
      - name: Software and invariant tests
        run: python -m unittest discover -s matrix_nlu -p 'test_*.py' -v
      - name: Reproduce typed datasets
        run: python matrix_nlu/build_dataset.py
      - name: Produce development predictions only
        shell: bash
        run: |
          set -euo pipefail
          python matrix_nlu/evaluate_e2e.py \
            --bundle "$TRAINING_BUNDLE" \
            --dataset build/matrix-nlu/data/matrix-dev.jsonl \
            --split dev --threshold 0 \
            --output-dir build/matrix-nlu/post-train/matrix-dev
          python matrix_nlu/evaluate_e2e.py \
            --bundle "$TRAINING_BUNDLE" \
            --dataset build/matrix-nlu/data/p05-dev.jsonl \
            --split dev --threshold 0 \
            --output-dir build/matrix-nlu/post-train/p05-dev
      - name: Select threshold from development evidence
        shell: bash
        run: |
          set -euo pipefail
          python matrix_nlu/select_threshold.py \
            --dataset build/matrix-nlu/data/matrix-dev.jsonl \
            --predictions build/matrix-nlu/post-train/matrix-dev/e2e-dev-predictions.jsonl \
            --dataset build/matrix-nlu/data/p05-dev.jsonl \
            --predictions build/matrix-nlu/post-train/p05-dev/e2e-dev-predictions.jsonl \
            --output build/matrix-nlu/post-train/threshold-selection.json
          THRESHOLD=$(python -c "import json; print(json.load(open('build/matrix-nlu/post-train/threshold-selection.json'))['selectedThreshold'])")
          echo "MATRIX_NLU_THRESHOLD=$THRESHOLD" >> "$GITHUB_ENV"
      - name: Evaluate frozen partitions once after dev gate
        shell: bash
        run: |
          set -euo pipefail
          python matrix_nlu/evaluate_e2e.py \
            --bundle "$TRAINING_BUNDLE" \
            --dataset build/matrix-nlu/data/matrix-test.jsonl \
            --split test --threshold "$MATRIX_NLU_THRESHOLD" \
            --output-dir build/matrix-nlu/post-train/matrix-test
          python matrix_nlu/evaluate_e2e.py \
            --bundle "$TRAINING_BUNDLE" \
            --dataset build/matrix-nlu/data/p05-test.jsonl \
            --split test --threshold "$MATRIX_NLU_THRESHOLD" \
            --output-dir build/matrix-nlu/post-train/p05-test
      - name: Export and measure FP32 and INT8 ONNX
        run: >-
          python matrix_nlu/export_onnx.py
          --bundle "$TRAINING_BUNDLE"
          --output-dir build/matrix-nlu/post-train/onnx
          --repetitions 30
      - name: Record resource and source-run evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_TRAINING_RUN=%s\n' "$SOURCE_TRAINING_RUN" | tee build/matrix-nlu/post-train/source-run.txt
          df -h .
          free -h
          find build/matrix-nlu/post-train -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > build/matrix-nlu/post-train/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-nlu-post-training-gates
          retention-days: 30
          path: build/matrix-nlu/post-train/
