name: P0 Understanding Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle --no-daemon :core:test
      - name: Baseline benchmark
        run: gradle --no-daemon :cli:run
      - uses: actions/upload-artifact@v4
        with:
          name: p0-baseline-results
          path: build/results/

