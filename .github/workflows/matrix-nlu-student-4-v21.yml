name: Matrix-NLU Student-4 V2.1 Controlled Stop

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/student-4-v21.trigger'

permissions:
  contents: read

jobs:
  train-and-dev-only:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TRAINING_DIR: build/matrix-nlu/training-student-4-v2.1
      VERIFY_DIR: build/matrix-nlu/verification-training-student-4-v2.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: matrix_nlu/requirements-train.txt
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: matrix-nlu-geotrend-36de33ec-v21
      - name: Install pinned dependencies
        run: python -m pip install --requirement matrix_nlu/requirements-train.txt
      - name: Run software regression tests
        run: python -m unittest discover -s matrix_nlu -p 'test_*.py' -v
      - name: Build immutable v2 dataset revision
        run: python matrix_nlu/build_dataset_v2.py
      - name: Audit dataset before training
        run: >-
          python matrix_nlu/audit_dataset_v2.py
          --data-dir build/matrix-nlu/data-v2
          --output build/matrix-nlu/automation/dataset-v21-audit.json
          --fail-on-error
      - name: Prepare train and dev auxiliary supervision
        run: >-
          python matrix_nlu/prepare_massive.py
          --train-per-language 3000
          --dev-per-language 600
          --test-per-language 0
          --seed 810923
      - name: Train fresh Student-4-v2.1
        run: >-
          python matrix_nlu/train.py
          --config matrix_nlu/train_config_v21.json
          --data-dir build/matrix-nlu/data-v2
          --massive-dir build/matrix-nlu/massive
          --output-dir "$TRAINING_DIR"
          --student-layers 4
          --defer-frozen
      - name: Evaluate development and stop
        run: >-
          python matrix_nlu/controlled_dev_v21.py
          --bundle "$TRAINING_DIR"
          --data-dir build/matrix-nlu/data-v2
          --output-dir "$VERIFY_DIR"
      - name: Record checksums and frozen guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/matrix-nlu/automation
          find build/matrix-nlu -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > build/matrix-nlu/automation/SHA256SUMS
          printf '%s\n' 'frozenDataRead=false' 'trainingSplitsRead=train,dev' \
            > build/matrix-nlu/automation/FROZEN_GUARD.txt
          df -h . > build/matrix-nlu/automation/disk.txt
          free -h > build/matrix-nlu/automation/memory.txt
      - name: Upload controlled-stop report evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-nlu-student-4-v21-report-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/matrix-nlu/automation/
            ${{ env.VERIFY_DIR }}/
            build/matrix-nlu/data-v2/*manifest.json
            build/matrix-nlu/data-v2/v1-to-v2-corrections.json
            ${{ env.TRAINING_DIR }}/training-result.json
            ${{ env.TRAINING_DIR }}/training-progress.json
            ${{ env.TRAINING_DIR }}/labels.json
      - name: Upload isolated model bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-nlu-student-4-v21-bundle-${{ github.run_id }}
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
          path: |
            ${{ env.TRAINING_DIR }}/training-result.json
            ${{ env.TRAINING_DIR }}/labels.json
            ${{ env.TRAINING_DIR }}/model-state.pt
            ${{ env.TRAINING_DIR }}/tokenizer/
      - name: Upload resumable checkpoint for preservation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-nlu-student-4-v21-resume-${{ github.run_id }}
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
          path: ${{ env.TRAINING_DIR }}/checkpoints/latest.pt
