plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matrix.p0.probe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.matrix.p0.probe'
        // OpenNLP 2.5.11 uses MethodHandle.invoke in its Snowball classes;
        // D8 requires Android O/API 26 even though platform ICU begins at 24.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-p0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir rootProject.file('gold')
    }

    packaging {
        resources {
            // Each OpenNLP tools/model JAR ships this Maven dependency index.
            // It is not a runtime resource and four identical paths cannot merge.
            excludes += ['META-INF/DEPENDENCIES', 'model.properties']
        }
    }
}

dependencies {
    implementation project(':core')
}
